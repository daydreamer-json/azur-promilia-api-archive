name: Auto API update check
permissions:
  contents: write
'on':
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (branch main)
        uses: actions/checkout@v7

      - name: Checkout data (branch archive)
        uses: actions/checkout@v7
        with:
          ref: archive
          path: data

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure git
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run archive script
        uses: nick-fields/retry@v3
        with:
          max_attempts: 5
          timeout_minutes: 10
          command: bun run src/main.ts archive --output-dir data/output

      - name: Format output folder
        run: bun x oxfmt data/output

      - name: Git commit and push
        working-directory: data
        run: |
          git add output/api/ output/raw/
          git commit -m "[Auto] API update" || echo "No changes to commit"
          git push origin archive
